BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "rpi4-rauc"
BBFILE_PATTERN_rpi4-rauc = "^${LAYERDIR}/"
BBFILE_PRIORITY_rpi4-rauc = "10"

LAYERSERIES_COMPAT_rpi4-rauc = "scarthgap"
LAYERDEPENDS_rpi4-rauc = "core raspberrypi rauc"
