header:
  version: 14
  includes:
    - er-tft395.yml
    - bbq20kbd.yml

machine: raspberrypi4-64
distro: poky
target:
  - rpi4-rauc-image
  - rpi4-rauc-bundle

# Pass through from your shell:
# WIFI_SSID=... WIFI_PSK=... kas build kas-rpi4.yml
# or
# export WIFI_SSID='...' WIFI_PSK='...' WIFI_COUNTRY=RO
# kas-container --runtime-args "-e WIFI_SSID -e WIFI_PSK -e WIFI_COUNTRY" build kas-rpi4.yml
env:
  WIFI_SSID: ""
  WIFI_PSK: ""
  WIFI_COUNTRY: "RO"
# Override from the shell: RAUC_BUNDLE_VERSION=1.0.1 kas build rpi4-rauc.kas.yml
  RAUC_BUNDLE_VERSION: "0.1.0"

repos:
  meta-custom:
    path: meta-custom
  meta-rpi4-rauc:
    path: meta-rpi4-rauc

  poky:
    url: https://git.yoctoproject.org/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:
      meta-python:
      meta-networking:

  meta-raspberrypi:
    url: https://git.yoctoproject.org/meta-raspberrypi
    branch: scarthgap

  meta-rauc:
    url: https://github.com/rauc/meta-rauc.git
    branch: scarthgap


local_conf_header:
  base: |
    CONF_VERSION = "2"
    ENABLE_UART = "1"
    EXTRA_IMAGE_FEATURES = "debug-tweaks"
    LICENSE_FLAGS_ACCEPTED += "synaptics-killswitch"
    DISTRO_FEATURES:append = " systemd usrmerge wifi zeroconf"
    DISTRO_FEATURES_BACKFILL_CONSIDERED = "sysvinit"
    VIRTUAL-RUNTIME_init_manager = "systemd"
    VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
    PACKAGECONFIG:append:pn-systemd = " networkd"
    # ext4 is what RAUC writes into the inactive slot; wic is for the first flash
    IMAGE_FSTYPES = "ext4 wic.bz2 wic.bmap"
    WKS_FILE = "rpi4-rauc-dual.wks.in"
    hostname:pn-base-files = "rpi4"
    RPI_USE_U_BOOT = "1"
    IMAGE_INSTALL:append = " kernel-modules"
  wifi: |
    WIFI_SSID ?= ""
    WIFI_PSK ?= ""
    WIFI_COUNTRY ?= "RO"
  init-and-rauc: |
    INIT_MANAGER = "systemd"
    DISTRO_FEATURES:append = " rauc"
  rauc-signing: |
    RAUC_KEYRING_FILE = "ca.cert.pem"
    RAUC_KEYS_DIR = "${TOPDIR}/../keys"
