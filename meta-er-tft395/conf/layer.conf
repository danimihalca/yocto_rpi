# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "er-tft"
BBFILE_PATTERN_er-tft = "^${LAYERDIR}/"
BBFILE_PRIORITY_er-tft = "6"

LAYERDEPENDS_er-tft = "core"
# Adjust to the Yocto releases you build with
LAYERSERIES_COMPAT_er-tft = "scarthgap styhead walnascar whinlatter"

# Raspberry Pi support, only parsed when meta-raspberrypi is present
BBFILES_DYNAMIC += "raspberrypi:${LAYERDIR}/dynamic-layers/raspberrypi/recipes-*/*/*.bbappend"
