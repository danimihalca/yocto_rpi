CONFIG_SPI=y
CONFIG_SPI_BCM2835=y
CONFIG_DRM=m
CONFIG_DRM_KMS_HELPER=m
CONFIG_DRM_GEM_DMA_HELPER=m
# fbdev emulation (text console, /dev/fb0) depends on CONFIG_FB, and the /dev/fb* nodes need
# CONFIG_FB_DEVICE (6.6+). The vendor kernel already enables these (fb0 appeared once the
# overlay loaded); they are listed so a leaner kernel config does not silently drop them.
CONFIG_FB=y
CONFIG_FB_DEVICE=y
CONFIG_DRM_FBDEV_EMULATION=y
CONFIG_OF_DISPLAY_TIMING=y
CONFIG_VT=y
CONFIG_VT_CONSOLE=y
CONFIG_FRAMEBUFFER_CONSOLE=y
# large console font for the 720x720 panel (fbcon=font:TER16x32 -> 45x22 characters)
CONFIG_FONTS=y
CONFIG_FONT_TER16x32=y
CONFIG_DMA_CMA=y
